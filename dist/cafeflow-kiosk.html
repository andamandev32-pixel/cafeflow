<style>
/* ===== ds-tokens.css ===== */
/* ============================================================
   MediCore Design System — TOKENS
   ------------------------------------------------------------
   :root เดียวจบ (Light theme only)

   ไฟล์นี้รวมโทเคนที่เดิมกระจายอยู่ 6 ไฟล์และทับกันเอง
   (design-tokens.css / theme-bridge.css / smart-ipd-tokens.css /
    doctor.css / hub.css / main.css) ซึ่งทำให้ค่าที่ได้จริง
   ขึ้นกับลำดับ <link> ของแต่ละหน้า — ที่นี่ประกาศครั้งเดียว

   ⚠️ ต้องโหลดเป็นไฟล์แรกเสมอ
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap');

:root {

  /* ══════════════════════════════════════════════════════════
     1. SHELL — โครงหลัก (navbar / hero / sidebar / ตัวอักษร)
     ══════════════════════════════════════════════════════════ */
  --brand-navy:           #0f172a;   /* Slate-900 — navbar, hero, หัวข้อ */
  --brand-navy-700:       #1e293b;   /* Slate-800 — hover / surface รอง */
  --brand-navy-600:       #334155;   /* Slate-700 — เส้นขอบบนพื้น navy */
  --brand-navy-500:       #475569;   /* Slate-600 — ตัวอักษรรองบนพื้นสว่าง */
  --brand-navy-300:       #94a3b8;   /* Slate-400 — placeholder */
  --brand-navy-on:        #ffffff;   /* ตัวอักษรบนพื้น navy */

  /* ══════════════════════════════════════════════════════════
     2. ACTION — ลิงก์ / ปุ่มบันทึก / focus ring
     ══════════════════════════════════════════════════════════ */
  --primary:              #0068FF;
  --primary-dark:         #0050CC;
  --primary-light:        #4d94ff;
  --primary-bg:           #e8f1ff;
  --primary-border:       #b3d4ff;

  --accent:               #FF6913;   /* ส้ม — ปุ่ม "บันทึกและส่ง" */
  --accent-dark:          #E55A0B;

  /* ══════════════════════════════════════════════════════════
     3. CTA / HIGHLIGHT — ปุ่มหลัก, active sidebar, hover การ์ด
     ══════════════════════════════════════════════════════════ */
  --brand-amber:          #fbbf24;   /* Amber-400 */
  --brand-amber-500:      #f59e0b;   /* hover / pressed */
  --brand-amber-600:      #d97706;   /* active / border */
  --brand-amber-100:      #fef3c7;   /* พื้นอ่อน (chip, banner) */
  --brand-amber-50:       #fffbeb;
  --brand-amber-on:       #1e293b;   /* ตัวอักษรเข้มบนพื้น amber */

  /* ══════════════════════════════════════════════════════════
     4. ACCENT หน้าแรก — violet + สีประจำหมวด
     ══════════════════════════════════════════════════════════ */
  --purple:   #7c3aed;
  --purple2:  #6d28d9;
  --purple-l: #a855f7;
  --blue:     #2563eb;
  --teal:     #0891b2;
  --green:    #059669;
  --red:      #dc2626;
  --orange:   #d97706;
  --slate:    #64748b;

  /* ══════════════════════════════════════════════════════════
     5. SURFACE / พื้นผิว
     ══════════════════════════════════════════════════════════ */
  --brand-white:          #ffffff;
  --white:                #ffffff;
  --brand-bg:             #f8fafc;   /* พื้นหน้า — Slate-50 */
  --brand-bg-strong:      #f1f5f9;   /* Slate-100 — แถวสลับ */
  --bg:                   #f0f2f5;   /* พื้นหน้าแบบเทาเข้มขึ้น (แอป 3-pane) */
  --surface-1:            #f8fafc;
  --surface-2:            #f1f5f9;

  --brand-border:         #e2e8f0;   /* Slate-200 */
  --brand-border-strong:  #cbd5e1;   /* Slate-300 */
  --border:               #e4e7ec;
  --border-light:         #f0f2f5;

  /* ══════════════════════════════════════════════════════════
     6. TEXT
     ══════════════════════════════════════════════════════════ */
  --text:                 #1a2133;
  --text-primary:         #1e293b;
  --text-secondary:       #475569;
  --text-muted:           #6b7485;
  --text-light:           #9aa1ad;

  /* ══════════════════════════════════════════════════════════
     7. STATUS — ใช้กับ chip / banner / badge (แยกจาก brand)
     ══════════════════════════════════════════════════════════ */
  --status-success:        #10b981;
  --status-success-soft:   #d1fae5;
  --status-success-strong: #047857;

  --status-warning:        #f59e0b;
  --status-warning-soft:   #fef3c7;
  --status-warning-strong: #92400e;

  --status-danger:         #ef4444;
  --status-danger-soft:    #fee2e2;
  --status-danger-strong:  #991b1b;

  --status-info:           #3b82f6;
  --status-info-soft:      #dbeafe;
  --status-info-strong:    #1e40af;

  --status-muted:          #94a3b8;
  --status-muted-soft:     #f1f5f9;

  --status-acknowledged:      #6366f1;
  --status-acknowledged-soft: #e0e7ff;

  /* alias สั้น (ใช้กับปุ่ม/ป้ายเดิม) */
  --success:      #00B37A;   --success-bg: #e6f9f2;
  --warning:      #FF9F0A;   --warning-bg: #fff7e6;
  --danger:       #FF3B30;   --danger-bg:  #fff0ef;
  --info:         #0068FF;

  /* ══════════════════════════════════════════════════════════
     8. TYPOGRAPHY
     ══════════════════════════════════════════════════════════ */
  --font-main:  'Inter', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  /* mono: ไม่โหลด webfont — ใช้ของระบบ (ของเดิมอ้าง JetBrains Mono แต่ไม่เคยโหลดจริง) */
  --font-mono:  ui-monospace, 'Cascadia Code', 'Consolas', 'Courier New', monospace;
  /* ฟอนต์เอกสาร/ใบพิมพ์ราชการไทย */
  --font-print: 'Sarabun', 'TH Sarabun PSK', 'Noto Sans Thai', serif;

  --font-size-xs:   10px;   /* จิ๋ว — เท่าที่จำเป็น */
  --font-size-sm:   11px;   /* chip / badge */
  --font-size-base: 13px;   /* เนื้อหา / input */
  --font-size-md:   14px;   /* base ของ body */
  --font-size-lg:   16px;
  --font-size-xl:   18px;
  --font-size-2xl:  22px;
  --font-size-3xl:  28px;

  /* ══════════════════════════════════════════════════════════
     9. SPACING
     ══════════════════════════════════════════════════════════ */
  --space-xs:  4px;
  --space-sm:  8px;
  --space-md:  16px;
  --space-lg:  24px;
  --space-xl:  32px;
  --space-2xl: 48px;

  /* ══════════════════════════════════════════════════════════
     10. RADIUS
     ══════════════════════════════════════════════════════════ */
  --r-sm:   6px;
  --r-md:   8px;
  --r-lg:   12px;
  --r-xl:   16px;
  --r-pill: 999px;

  /* alias ชุดเดิม */
  --radius:      10px;
  --radius-sm:   6px;
  --radius-md:   10px;
  --radius-lg:   14px;
  --radius-pill: 999px;
  --radius-full: 50%;

  /* ══════════════════════════════════════════════════════════
     11. SHADOW
     ══════════════════════════════════════════════════════════ */
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow:    0 1px 4px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10);
  --shadow-lg: 0 12px 28px rgba(0,0,0,.12);

  --sip-shadow-1: 0 1px 3px rgba(15,23,42,.06);
  --sip-shadow-2: 0 4px 12px rgba(15,23,42,.08);
  --sip-shadow-3: 0 12px 28px rgba(15,23,42,.12);
  --sip-shadow-glow-amber: 0 0 0 3px rgba(251,191,36,.25);

  /* เงาเด่นของหน้าแรก */
  --shadow-hero:    0 4px 24px rgba(0,0,0,.08);
  --shadow-hero-lg: 0 12px 40px rgba(0,0,0,.15);

  /* ══════════════════════════════════════════════════════════
     12. TRANSITION
     ══════════════════════════════════════════════════════════ */
  --transition-fast: 150ms cubic-bezier(.4, 0, .2, 1);
  --transition-base: 250ms cubic-bezier(.4, 0, .2, 1);
  --transition-slow: 400ms cubic-bezier(.4, 0, .2, 1);

  /* ══════════════════════════════════════════════════════════
     13. LAYOUT
     ══════════════════════════════════════════════════════════ */
  --header-h:              56px;   /* ความสูง navbar — .ds-shell พึ่งค่านี้ */
  --sidebar-w:             240px;
  --sidebar-w-collapsed:   72px;
  --pane-left-w:           280px;
  --pane-right-w:          360px;
  --content-max:           1280px;
  --gutter:                24px;
  --drawer-w:              480px;

  /* ══════════════════════════════════════════════════════════
     14. Z-INDEX — ค่าที่ "ใช้จริง" (ของเดิมประกาศ scale ไว้แต่ไม่มีใครใช้)
     ══════════════════════════════════════════════════════════ */
  --z-base:            1;
  --z-dropdown:        100;
  --z-sticky:          200;
  --z-overlay-page:    950;    /* overlay เต็มจอใต้ navbar */
  --z-navbar:          1100;
  --z-drawer-overlay:  1290;
  --z-drawer:          1300;   /* ⚠️ ต้องสูงกว่า navbar ไม่งั้น navbar บัง drawer */
  --z-modal-overlay:   1390;
  --z-modal:           1400;
  --z-confirm:         1500;   /* confirm ต้องลอยเหนือ drawer/modal */
  --z-toast:           11000;
  --z-tooltip:         12000;
}


/* ============================================================
   ภาคผนวก — โทเคนเฉพาะโดเมนคลินิก (CPOE / โรงพยาบาล)
   ถ้าโปรเจคใหม่ไม่ใช่ระบบโรงพยาบาล ลบบล็อกนี้ทิ้งได้ทั้งก้อน
   ============================================================ */
:root {
  /* หมวดคำสั่ง */
  --cat-med:        #3b82f6;
  --cat-lab:        #8b5cf6;
  --cat-radiology:  #06b6d4;
  --cat-procedure:  #f97316;
  --cat-consult:    #6366f1;
  --cat-nursing:    #10b981;
  --cat-diet:       #f59e0b;
  --cat-referral:   #ec4899;

  /* สถานะคำสั่ง CPOE */
  --cpoe-draft:     #94a3b8;
  --cpoe-hold:      #f59e0b;
  --cpoe-active:    #3b82f6;
  --cpoe-completed: #10b981;
  --cpoe-cancelled: #ef4444;
  --cpoe-verified:  #8b5cf6;

/* ===== ds-base.css ===== */
/* ============================================================
   MediCore Design System — BASE
   reset · body · scrollbar · keyframes · icon · utilities
   โหลดต่อจาก ds-tokens.css
   ============================================================ */

/* ══════════════ RESET ══════════════ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* หน้าเลื่อนได้เป็นค่าเริ่มต้น
   (ของเดิม doctor.css บังคับ body{overflow:hidden} ให้ทุกหน้า
    ทำให้หน้าธรรมดาต้อง hack override — ที่นี่กลับด้าน:
    เฉพาะ .ds-shell เท่านั้นที่ล็อกการเลื่อน ดู ds-layout.css) */
body {
  font-family: var(--font-main);
  background: var(--brand-bg);
  color: var(--brand-navy);
  font-size: 14px;
  line-height: 1.55;
  min-height: 100vh;
}

a { color: var(--primary); text-decoration: none; cursor: pointer; }
a:hover { color: var(--primary-dark); }

button, input, select, textarea { font-family: inherit; }

/* ══════════════ SCROLLBAR ══════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--brand-border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--brand-navy-300); }

/* ══════════════ ICONS (Lucide) ══════════════
   .mi  = ไอคอนใน text — ขนาดตามฟอนต์รอบข้าง (utility ที่มีประโยชน์ที่สุด)
   .icon-* = ขนาดคงที่
   ═════════════════════════════════════════════ */
[data-lucide] { stroke-width: 2; flex-shrink: 0; }

.mi {
  width: 1.05em; height: 1.05em;
  vertical-align: -0.15em;
  display: inline-block;
  flex-shrink: 0;
}
.lucide { vertical-align: -0.125em; }

.icon-xs  { width: 12px; height: 12px; }
.icon-sm  { width: 14px; height: 14px; }
.icon-md  { width: 16px; height: 16px; }
.icon-lg  { width: 20px; height: 20px; }
.icon-xl  { width: 28px; height: 28px; stroke-width: 1.5; }
.icon-2xl { width: 48px; height: 48px; stroke-width: 1.5; }

.icon-amber   { color: var(--brand-amber-600); }
.icon-navy    { color: var(--brand-navy); }
.icon-primary { color: var(--primary); }
.icon-muted   { color: var(--brand-navy-500); }
.icon-success { color: var(--status-success-strong); }
.icon-warning { color: var(--status-warning-strong); }
.icon-danger  { color: var(--status-danger); }

/* ══════════════ TYPOGRAPHY HELPERS ══════════════
   สเกล: body 14 / เนื้อหา 13 / meta 12 / chip 11 / จิ๋ว 10
   ⚠️ ห้ามใช้ < 12px กับ "เนื้อหาที่ต้องอ่าน" — เก็บ 10–11px ไว้เฉพาะ chip/badge
   ═════════════════════════════════════════════════ */
.ds-title-page {
  font-size: 22px; font-weight: 800; color: var(--brand-navy);
  letter-spacing: -.3px;
}
.ds-title-section { font-size: 15px; font-weight: 700; color: var(--brand-navy); }

.text-primary   { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-muted     { color: var(--text-muted); }
.text-accent    { color: var(--primary); }
.text-success   { color: var(--status-success-strong); }
.text-warning   { color: var(--status-warning-strong); }
.text-danger    { color: var(--status-danger); }

.font-mono     { font-family: var(--font-mono); }
.font-bold     { font-weight: 700; }
.font-semibold { font-weight: 600; }
.tabular       { font-variant-numeric: tabular-nums; }

.uppercase { text-transform: uppercase; letter-spacing: .5px; }
.truncate  { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ══════════════ LAYOUT UTILITIES ══════════════ */
.flex         { display: flex; }
.flex-col     { display: flex; flex-direction: column; }
.flex-center  { display: flex; align-items: center; justify-content: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-wrap    { flex-wrap: wrap; }
.gap-xs { gap: var(--space-xs); }
.gap-sm { gap: var(--space-sm); }
.gap-md { gap: var(--space-md); }
.gap-lg { gap: var(--space-lg); }
.ds-spacer  { flex: 1; }
.ds-divider { height: 1px; background: var(--brand-border); margin: 16px 0; }

.hidden  { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

/* ══════════════ ANIMATIONS ══════════════ */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .5; }
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50%      { opacity: .5; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes modalIn {
  from { opacity: 0; transform: scale(.95); }
  to   { opacity: 1; transform: scale(1); }
}

/* ===== ds-cafeflow-theme.css ===== */
@import url('https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap');

/* ============================================================
   CafeFlow — THEME: AndamanTech ServiceFlow
   ------------------------------------------------------------
   ทับ MediCore design system ให้เป็นภาษาเดียวกับ ServiceFlow
   (https://serviceflow-alpha.vercel.app) ซึ่งเป็นผลิตภัณฑ์พี่น้อง
   ค่าทุกตัวดึงจาก computed style ของของจริง ไม่ได้กะเอา

   สามอย่างที่ทำให้ "ใช่":
     1. เขียว #06C755 (ไม่ใช่ #1E8F5A)
     2. ไม่มีเงาเลยสักจุด — ความลึกมาจากเส้นขอบ 0.8px #DFDFDF
     3. แถบหัวเว็บสีขาว ไม่ใช่ navy

   ⚠️ ต้องโหลดหลัง ds-*.css ทุกไฟล์
      :root ชนะได้ทุกตำแหน่ง แต่ส่วนซ่อมสี hard-code ชนะด้วย source order เท่านั้น
   ไม่แตะไฟล์ใน design-system-2/ เลย — ถอดไฟล์นี้ออกแล้วกลับเป็น MediCore ทันที
   ============================================================ */

:root {
  /* ── 1. BRAND ─────────────────────────────────────────────
     --primary-dark คือสีของ "ตัวอักษรเขียวบนพื้นสว่าง"
     ห้ามใช้ #06C755 เป็นสีตัวอักษร คอนทราสต์ไม่ผ่าน */
  --primary:              #06C755;
  --primary-dark:         #058739;
  --primary-light:        #3FD97F;
  --primary-bg:           #EFFBF4;
  --primary-border:       #CDEBD9;

  /* สีรองของ ServiceFlow — ไอคอนหมวด, focus ring, ครึ่งขวาของแถบไล่สี */
  --blue:                 #3579EA;
  --blue-bg:              #EEF4FE;

  --accent:               #C2601A;
  --accent-dark:          #A24E12;

  /* ── 2. CTA — DS ใช้ --brand-amber เป็นสีปุ่มหลักโดยตั้งใจ (README §2)
        จึงต้อง remap ชั้นนี้ด้วย ไม่ใช่แค่ --primary ── */
  --brand-amber:          #06C755;
  --brand-amber-500:      #058739;
  --brand-amber-600:      #047A33;
  --brand-amber-on:       #ffffff;
  --sip-shadow-glow-amber: 0 0 0 3px rgba(53,121,234,.15);
  /* --brand-amber-100/-50 ไม่แตะ — ยังเป็นพื้นของ warning (ดูส่วนซ่อมด้านล่าง) */

  /* ── 3. SHELL / INK ──────────────────────────────────────── */
  --brand-navy:           #111111;
  --brand-navy-700:       #333333;
  --brand-navy-600:       #444444;
  --brand-navy-500:       #666666;
  --brand-navy-300:       #888888;
  --brand-navy-on:        #ffffff;

  /* เดิมเป็นม่วง — ใช้กับ .ds-tab.active, avatar, .mc-dd-item:hover */
  --purple:   #058739;
  --purple2:  #047A33;
  --purple-l: #3FD97F;
  --green:    #06C755;
  --teal:     #21B5CB;

  /* ── 4. SURFACE ──────────────────────────────────────────── */
  --brand-white:          #ffffff;
  --white:                #ffffff;
  --brand-bg:             #F5F5F5;
  --brand-bg-strong:      #EFEFEF;
  --bg:                   #F5F5F5;
  --surface-1:            #FAFAFA;
  --surface-2:            #F5F5F5;

  --brand-border:         #DFDFDF;
  --brand-border-strong:  #CFCFCF;
  --border:               #DFDFDF;
  --border-light:         #E8E8E8;

  /* ── 5. TEXT ─────────────────────────────────────────────── */
  --text:                 #111111;
  --text-primary:         #111111;
  --text-secondary:       #444444;
  --text-muted:           #666666;
  --text-light:           #888888;

  /* ── 6. STATUS — ความหมายเชิงปฏิบัติการต้องคงไว้ ─────────── */
  --success:      #06C755;   --success-bg: #EFFBF4;
  --status-success:        #06C755;
  --status-success-soft:   #EFFBF4;
  --status-success-strong: #058739;
  --info:         #3579EA;
  --status-info:           #3579EA;
  --status-info-soft:      #EEF4FE;
  --status-info-strong:    #1E5BC6;

  /* ── 7. TYPOGRAPHY ───────────────────────────────────────── */
  --font-main:    'Anuphan', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-print:   'Anuphan', 'Sarabun', sans-serif;
  --font-receipt: 'Anuphan', 'Courier New', monospace;

  /* ServiceFlow ใช้ body 16px — ที่นี่ขยายแบบพอดี ไม่ให้หน้าปฏิบัติการหลวมจนใช้ยาก */
  --font-size-xs:   11px;
  --font-size-sm:   12px;
  --font-size-base: 14px;
  --font-size-md:   15px;
  --font-size-lg:   17px;
  --font-size-xl:   20px;
  --font-size-2xl:  26px;
  --font-size-3xl:  34px;

  /* ── 8. ไม่มีเงา ─────────────────────────────────────────── */
  --shadow-sm: none;  --shadow: none;  --shadow-md: none;  --shadow-lg: none;
  --sip-shadow-1: none; --sip-shadow-2: none; --sip-shadow-3: none;
  --shadow-hero: none;  --shadow-hero-lg: none;

  /* ── 9. LAYOUT ───────────────────────────────────────────── */
  --header-h: 60px;
  --hairline: 0.8px;      /* ServiceFlow ใช้ 0.8px จริง ไม่ใช่ 1px */
}

/* ══════════════════════════════════════════════════════════
   ซ่อม WARNING — ผลพวงจากการ remap --brand-amber เป็นเขียว
   สามกฎนี้ใช้ --brand-amber-100/-50 เป็นพื้น (เหลือง = เตือน)
   แต่ใช้ --brand-amber-500 เป็นขอบและ --brand-amber-on เป็นตัวอักษร
   ซึ่งตอนนี้กลายเป็นเขียว/ขาว → ขาวบนเหลืองอ่อน อ่านไม่ออก
   ══════════════════════════════════════════════════════════ */
.sip-chip-amber   { color: #8A6400; background: var(--brand-amber-100); border-color: #F0C040; }
.sip-banner-draft { color: #8A6400; background: var(--brand-amber-100); border-color: #F0C040; }
.ds-warn          { color: #8A6400; background: var(--brand-amber-50);  border-color: #FDE68A; }

/* ══════════════════════════════════════════════════════════
   FLAT — กวาดเงาที่ hard-code ไว้ออกให้หมด
   ══════════════════════════════════════════════════════════ */
.card, .sip-card, .section-card, .clinical-card, .sip-kpi, .sip-table,
.ds-context-bar, .ds-quick-link, .ds-alert-card, .ds-alert-card:hover,
.sip-card-hover:hover, .sip-kpi:hover, .btn-save:hover, .btn-save-send:hover,
.ds-pilltab.active, .ds-seg.active, .mc-navbar, .mc-dd-menu,
.drawer-panel, .modal, .toast, .mc-confirm-box, .ds-toggle-track .ds-toggle-knob {
    box-shadow: none !important;
}
/* hover ของ ServiceFlow เป็นการสลับสีล้วน ไม่มีการขยับ */
.sip-card-hover:hover, .sip-kpi:hover, .btn-save:hover, .btn-save-send:hover,
.ds-alert-card:hover, .ds-quick-link:hover {
    transform: none !important;
}

/* เส้นขอบบางแบบ ServiceFlow */
.card, .sip-card, .section-card, .clinical-card, .sip-kpi,
.ds-list-card, .table-wrap, .ds-quick-link, .mc-dd-menu {
    border-width: var(--hairline);
}

/* ══════════════════════════════════════════════════════════
   NAVBAR — navy → ขาว
   ds-navbar.css สมมติว่าพื้นเข้มตลอด ทุกคลาสที่กำหนดสีตัวอักษร
   จึงต้องทับให้ครบ ไม่งั้นได้ขาวบนขาว
   ══════════════════════════════════════════════════════════ */
.mc-navbar {
    background: #fff;
    border-bottom: var(--hairline) solid var(--brand-border);
    position: relative;
}
/* แถบไล่สี 4px — ลายเซ็นของ ServiceFlow
   วางไว้ใน navbar (ไม่ใช่ body) เพื่อไม่ให้กระทบ layout แม้แต่พิกเซลเดียว */
.mc-navbar::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #06C755 0%, #06C755 55%, #3579EA 55%, #3579EA 100%);
}

.mc-logo-mark   { background: var(--primary); border-radius: 10px; box-shadow: none; }
.mc-logo-text   { color: #111; }
.mc-logo-sub    { color: var(--text-muted); }
.mc-nav-sep     { background: var(--brand-border); }

.mc-nav-dd-btn  { color: var(--text-muted); font-weight: 600; }
.mc-nav-dd-btn:hover,
.mc-nav-dropdown.open .mc-nav-dd-btn   { background: var(--brand-bg); color: #111; }
.mc-nav-dropdown.active .mc-nav-dd-btn {
    background: var(--primary-bg); color: var(--primary-dark);
    border-bottom: 2px solid var(--primary);
}
.mc-caret { opacity: .5; }

.mc-dd-menu        { border: var(--hairline) solid var(--brand-border); border-radius: 12px; }
.mc-dd-item        { color: var(--text-secondary); }
.mc-dd-item:hover  { background: var(--brand-bg); color: #111; }
.mc-dd-item.active { background: var(--primary-bg); color: var(--primary-dark); }
.mc-dd-section     { color: var(--text-light); }
.mc-dd-sep         { background: var(--border-light); }
.mc-dd-sep-strong  { background: var(--brand-border); }
.mc-di-badge.live  { background: var(--primary-bg); color: var(--primary-dark); }

.mc-nav-link {
    color: var(--text-muted); background: #fff;
    border: var(--hairline) solid var(--brand-border);
}
.mc-nav-link:hover  { background: var(--brand-bg); color: #111; }
.mc-nav-link.active {
    background: var(--primary-bg); border-color: var(--primary-border); color: var(--primary-dark);
}

.mc-nav-clock    { color: var(--text-muted); }
.mc-nav-user-chip{ background: #fff; border: var(--hairline) solid var(--brand-border); }
.mc-nav-avatar   { background: var(--primary); color: #fff; }
.mc-nav-username { color: #111; }
.mc-nav-userrole { color: var(--text-muted); }

.mc-btn-logout {
    background: #fff; border: var(--hairline) solid var(--brand-border);
    color: var(--text-secondary);
}
.mc-btn-logout:hover {
    background: var(--danger-bg); border-color: var(--danger); color: var(--danger);
}

/* ══════════════════════════════════════════════════════════
   COMPONENTS
   ══════════════════════════════════════════════════════════ */

/* ปุ่ม — ใหญ่ขึ้น หนาขึ้น แบน */
.btn {
    padding: 11px 22px; font-size: 15px; font-weight: 700;
    border-radius: 8px; border-width: var(--hairline);
}
.btn-sm { padding: 7px 14px; font-size: 13px; }
.btn-lg { padding: 14px 28px; font-size: 17px; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover  { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn-primary:active { background: var(--primary-dark); }
.btn-outline { background: #fff; color: #111; border-color: var(--brand-border); }
.btn-outline:hover { background: var(--brand-bg); border-color: var(--brand-border-strong); }
.btn-ghost:hover   { background: var(--brand-bg); color: #111; }
.btn-navy    { background: #111; border-color: #111; }
.btn-navy:hover { background: #333; }
.btn-save    { background: var(--primary); border-color: var(--primary); }
.btn-save:hover { background: var(--primary-dark); }

/* ฟอร์ม — focus ring สีน้ำเงินแบบ ServiceFlow */
.sip-input, .sip-select, .sip-textarea {
    border-width: var(--hairline); border-radius: 8px;
    padding: 10px 12px; font-size: 15px;
}
.sip-input:focus, .sip-select:focus, .sip-textarea:focus {
    border-color: var(--blue); box-shadow: 0 0 0 3px rgba(53,121,234,.15);
}
.form-group input, .form-group select, .form-group textarea {
    border-width: var(--hairline); border-radius: 8px;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--blue); box-shadow: 0 0 0 3px rgba(53,121,234,.15);
}
.sip-label { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
.sip-checkbox, .sip-radio { accent-color: var(--primary); }
.ds-pane-search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(53,121,234,.15); }

/* ชิป */
.sip-chip { font-size: 12px; padding: 3px 10px; border-width: var(--hairline); }
.sip-chip-success { color: var(--primary-dark); background: var(--primary-bg); border-color: var(--primary-border); }
.sip-chip-progress{ color: #1E5BC6; background: var(--blue-bg); border-color: #C9DCFB; }
.ds-chip-toggle {
    padding: 6px 14px; font-size: 13px; border-radius: 999px;
    border-width: var(--hairline); background: #fff;
}
.ds-chip-toggle:hover { border-color: var(--primary); color: var(--primary-dark); }
.ds-chip-toggle.is-on { background: var(--primary); border-color: var(--primary); color: #fff; }
.ds-chip-suggest {
    border-color: var(--primary-border); color: var(--primary-dark); background: var(--primary-bg);
}
.ds-chip-suggest:hover { background: #E2F6EB; }
.status-badge { font-size: 12px; padding: 4px 12px; }
.status-badge.active, .status-badge.completed, .status-badge.confirmed,
.status-badge.in-progress { background: var(--primary-bg); color: var(--primary-dark); }
.kbadge-progress { background: var(--blue-bg); color: #1E5BC6; border-color: #C9DCFB; }

/* ตาราง — แถวสูงขึ้น หัวตารางเทาอ่อน */
.data-table thead th {
    background: var(--surface-1); color: var(--text-muted);
    font-size: 12px; padding: 12px 16px; border-bottom-width: var(--hairline);
}
.data-table tbody td { font-size: 14px; padding: 13px 16px; }
.data-table.compact td, .data-table.compact th { padding: 9px 12px; }
.data-table tbody tr:hover { background: var(--surface-1); }
.sip-table thead th { background: var(--surface-1); color: var(--text-muted); font-size: 12px; }
.ds-table-grid th, .ds-table-grid td { font-size: 13px; padding: 8px 10px; }

/* KPI */
.sip-kpi { padding: 16px 18px; border-width: var(--hairline); }
.sip-kpi .sip-kpi-value { font-size: 30px; font-weight: 800; }
.sip-kpi .sip-kpi-label { font-size: 13px; color: var(--text-muted); }
.sip-kpi .sip-kpi-icon {
    color: var(--primary-dark); background: var(--primary-bg);
    width: 38px; height: 38px; border-radius: 10px; padding: 8px;
    box-sizing: border-box; margin-bottom: 8px;
}
.sip-kpi.critical .sip-kpi-icon { background: var(--status-danger-soft); color: var(--status-danger); }
.sip-kpi:hover { border-color: var(--brand-border-strong); }

/* แท็บ */
.ds-tabs { border-bottom-width: var(--hairline); }
.ds-tab { font-size: 15px; padding: 11px 16px; }
.ds-tab.active { color: var(--primary-dark); border-bottom-color: var(--primary); }
.ds-seg { font-size: 13px; padding: 6px 14px; }
.ds-segbar { border-width: var(--hairline); }
.ds-pilltab { font-size: 13px; padding: 8px 8px; }
.ds-pilltab.active { background: var(--primary); }
.ds-pilltab:hover:not(.active) { background: var(--primary-bg); color: var(--primary-dark); }

/* หัวข้อ / การ์ด */
.page-title    { font-size: 26px; font-weight: 700; }
.page-subtitle { font-size: 14px; }
.page-title i, .page-title svg { color: var(--primary); }
.section-title { font-size: 17px; }
.card-title    { font-size: 14px; letter-spacing: 0; text-transform: none; }
.ds-pane-header h3 { font-size: 17px; }
.ds-pane-count { background: var(--primary-bg); color: var(--primary-dark); }
.ds-list-card.active { background: var(--primary-bg); border-color: var(--primary); }
.ds-list-card:hover  { background: var(--surface-1); }
.ds-list-card-name   { font-size: 14px; }
.ds-list-card-detail { font-size: 13px; }
.ds-context-bar { border-bottom-width: var(--hairline); }
.ds-context-avatar { background: var(--primary-bg); color: var(--primary-dark); border-radius: 12px; }
.ds-context-avatar.gradient { background: var(--primary); color: #fff; }
.ds-empty-state-title { font-size: 19px; }
.ds-empty-state-desc  { font-size: 15px; }
.ds-section-label { font-size: 12px; color: var(--text-muted); }
.ds-note, .ds-block, .ds-warn { font-size: 13px; }
.sip-banner { font-size: 14px; border-width: var(--hairline); }
.ds-step.completed { color: var(--primary-dark); }
.ds-toggle.is-on { color: var(--primary-dark); }
.ds-toggle.is-on .ds-toggle-track { background: var(--primary); }
.ds-timeline-item.accent { border-left-color: var(--primary); }
.ds-timeline-item.accent::before { background: var(--primary); }
.ds-icon-btn.edit:hover {
    color: var(--blue); border-color: #C9DCFB; background: var(--blue-bg);
}

/* Drawer / modal — ไม่มีเงาแล้วต้องพึ่งขอบ + ฉากหลังที่เข้มพอ */
.drawer-panel { border-left: var(--hairline) solid var(--brand-border); }
.drawer-root.open .drawer-overlay { background: rgba(17,17,17,.45); }
.drawer-title { font-size: 17px; }
.drawer-header, .drawer-footer { border-color: var(--brand-border); }
.modal { border: var(--hairline) solid var(--brand-border); }
.mc-confirm-box { border: var(--hairline) solid var(--brand-border); }
.toast { background: #111; }

/* ══════════════════════════════════════════════════════════
   LOGIN — เลิกใช้ธีมมืด เปลี่ยนเป็นการ์ดสว่างแบบ ServiceFlow
   ══════════════════════════════════════════════════════════ */
.login-overlay {
    background: #F7F7F7;
    padding: 24px;
}
.login-overlay::before { content: none; }
.login-card {
    background: #fff;
    border: var(--hairline) solid var(--brand-border);
    border-radius: 12px;
    box-shadow: none;
    backdrop-filter: none;
    max-width: 420px;
    padding: 36px 36px 30px;
    position: relative;
    overflow: hidden;
}
/* แถบไล่สีบนขอบการ์ด — เหมือนหน้า login ของ ServiceFlow เป๊ะ */
.login-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #06C755 0%, #06C755 55%, #3579EA 55%, #3579EA 100%);
}
.login-logo-mark  { background: var(--primary); box-shadow: none; border-radius: 10px; }
.login-logo-text h1 { color: #111; font-size: 22px; }
.login-logo-text p  { color: var(--text-muted); }
.login-divider    { background: var(--border-light); }
.login-label      { color: #111; font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.login-input {
    background: #fff; color: #111;
    border: var(--hairline) solid var(--brand-border); border-radius: 8px;
    font-size: 15px; padding: 11px 13px;
}
.login-input::placeholder { color: var(--text-light); }
.login-input:focus {
    border-color: var(--blue); background: #fff;
    box-shadow: 0 0 0 3px rgba(53,121,234,.15);
}
.login-btn {
    background: var(--primary); box-shadow: none;
    border-radius: 8px; height: 48px; font-size: 17px; font-weight: 700;
}
.login-btn:hover  { background: var(--primary-dark); box-shadow: none; transform: none; }
.login-error {
    background: var(--danger-bg); border: var(--hairline) solid #FFC9CE; color: #C80000;
    border-radius: 8px;
}
.login-footer { color: var(--text-light); }

/* ===== cf-kiosk.css ===== */
/* ============================================================
   CafeFlow — KIOSK (§9, §35)
   ------------------------------------------------------------
   จอสัมผัสยืนกด 21–32 นิ้ว Full HD
     ผืนผ้าใบ 1080×1920 (แนวตั้ง) / 1920×1080 (แนวนอน)
     ขนาดกายภาพแปรผัน → จอ 21.5" คือกรณีคับที่สุด (~102 PPI)

   กติกาของไฟล์นี้:
     1. ห้ามมี @media (max-width:…) เลย — media query วัด "หน้าต่าง"
        แต่เวทีแนวตั้งเป็นลูกที่ถูก letterbox ไว้ ค่าที่วัดได้จะโกหก
        สลับด้วย body.cfk-portrait / .cfk-landscape เท่านั้น
     2. ทุกขนาดเป็น calc(var(--u) * N) ห้ามใช้ px ดิบกับตัวอักษร ระยะ พื้นที่กด
     3. ห้ามมี box-shadow — ความลึกมาจากเส้นขอบและค่าความสว่าง (ตามธีม ServiceFlow)
     4. ปุ่มที่ต้องกดจริงอยู่ครึ่งล่างของจอเสมอ (โซนเอื้อมของคนตัวเล็ก/รถเข็น)

   namespace .cfk-* ทั้งหมด ไม่พึ่งคอมโพเนนต์ของ design system
   (ใช้แค่ชั้นโทเคนสีและฟอนต์ร่วมกัน)
   ============================================================ */

/* ══════════════════════════════════════════════════════════
   เวที
   ══════════════════════════════════════════════════════════ */
html { height: 100%; }
body.cf-kiosk {
    margin: 0; height: 100dvh; overflow: hidden;
    background: #14171A;
    font-family: var(--font-main);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
}
#cfkFrame { height: 100dvh; display: grid; place-items: center; }

#cfkStage {
    position: relative; overflow: hidden;
    background: var(--brand-bg);
    container-type: size; container-name: stage;
    display: grid;

    --scale: 1;                       /* JS ตั้งจาก settings.kioskScale */
    --u0: 10.8px;                     /* fallback — ต้องมาก่อน เผื่อไม่รองรับ cqi */
    --u0: clamp(7px, 1cqi, 14px);     /* แนวตั้ง 1080 → 1cqi = 10.8px */
    --u: calc(var(--u0) * var(--scale));

    --gap: calc(var(--u) * 1.3);
    --pad: calc(var(--u) * 2);
    --r:   calc(var(--u) * 1.2);
}
#cfkStage *, #cfkStage *::before, #cfkStage *::after { box-sizing: border-box; }

body.cfk-portrait  #cfkStage { width: min(100vw, calc(100dvh * 9 / 16)); height: 100dvh;
                               grid-template-rows: auto 1fr; }
body.cfk-landscape #cfkStage { width: 100vw; height: 100dvh;
                               --u0: 10.6px; --u0: clamp(7px, .55cqi, 14px);
                               grid-template-rows: auto 1fr; }

/* กรอบจำลองเมื่อดูบนจอคอม — outline ไม่ใช่ box-shadow */
body.cfk-frame.cfk-portrait #cfkStage {
    border-radius: calc(var(--u) * 1.6);
    outline: 8px solid #23282D;
}

/* ══════════════════════════════════════════════════════════
   ชิ้นส่วนร่วม
   ══════════════════════════════════════════════════════════ */
.cfk-screen { display: grid; min-height: 0; overflow: hidden; }

/* แถบหัว — ปุ่มย้อนกลับตำแหน่งตายตัวทุกหน้า */
.cfk-top {
    display: flex; align-items: center; gap: var(--gap);
    padding: var(--pad); background: #fff;
    border-bottom: 0.8px solid var(--brand-border);
    min-height: calc(var(--u) * 7);
}
.cfk-top-title { flex: 1; min-width: 0; }
.cfk-top-title b {
    display: block; font-size: calc(var(--u) * 2.2); font-weight: 700; color: #111;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cfk-top-title span { font-size: calc(var(--u) * 1.5); color: var(--text-muted); }

.cfk-back {
    flex-shrink: 0; width: calc(var(--u) * 5.4); height: calc(var(--u) * 5.4);
    display: grid; place-items: center; cursor: pointer;
    background: #fff; border: 0.8px solid var(--brand-border);
    border-radius: var(--r); color: #111;
}
.cfk-back:active { background: var(--brand-bg); }
.cfk-back .cfk-ic { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); }

/* ชิปโหมดรับของบนแถบหัว */
.cfk-mode {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: calc(var(--u) * .6);
    padding: calc(var(--u) * .8) calc(var(--u) * 1.6);
    min-height: calc(var(--u) * 5);            /* 54px = 13มม. ที่จอ 21.5" */
    background: var(--primary-bg); color: var(--primary-dark);
    border: 0.8px solid var(--primary-border); border-radius: 999px;
    font-size: calc(var(--u) * 1.4); font-weight: 700; cursor: pointer;
}
.cfk-mode .cfk-ic { width: calc(var(--u) * 1.7); height: calc(var(--u) * 1.7); }
/* ร้านที่รับแบบเดียว — ป้ายบอกสถานะ ไม่ใช่ปุ่ม (ขนาดเท่าเดิม แถบหัวจะได้ไม่ขยับ) */
.cfk-mode-static { cursor: default; }

/* ปุ่ม */
.cfk-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: calc(var(--u) * .8); cursor: pointer; font-family: inherit;
    min-height: calc(var(--u) * 7);                 /* ปุ่มหลัก ≈76px = 19มม. ที่ 21.5" */
    padding: 0 calc(var(--u) * 2.6);
    border-radius: var(--r); border: 0.8px solid transparent;
    font-size: calc(var(--u) * 2); font-weight: 700; white-space: nowrap;
}
.cfk-btn .cfk-ic { width: calc(var(--u) * 2.1); height: calc(var(--u) * 2.1); }
.cfk-btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.cfk-btn-primary:active { background: var(--primary-dark); }
.cfk-btn-ghost   { background: #fff; color: #111; border-color: var(--brand-border); }
.cfk-btn-ghost:active { background: var(--brand-bg); }
.cfk-btn:disabled { opacity: .4; pointer-events: none; }
.cfk-btn-grow { flex: 1; }

/* แถบปุ่มล่าง — อยู่ครึ่งล่างเสมอ */
.cfk-actionbar {
    display: flex; gap: var(--gap); padding: var(--pad);
    background: #fff; border-top: 0.8px solid var(--brand-border);
}

.cfk-note {
    display: flex; gap: calc(var(--u) * .8); align-items: flex-start;
    padding: calc(var(--u) * 1.2) calc(var(--u) * 1.4);
    background: var(--surface-1); border: 0.8px solid var(--brand-border);
    border-radius: var(--r); color: var(--text-secondary);
    font-size: calc(var(--u) * 1.45); line-height: 1.5;
}
.cfk-note .cfk-ic { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); flex-shrink: 0; }
.cfk-note-warn { background: var(--brand-amber-50); border-color: #FDE68A; color: #8A6400; }
.cfk-note-ok   { background: var(--primary-bg); border-color: var(--primary-border); color: var(--primary-dark); }

/* ══════════════════════════════════════════════════════════
   รูปภาพสินค้า
   ══════════════════════════════════════════════════════════ */
.cfk-media {
    position: relative; display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(155deg, var(--t1) 0%, var(--t2) 100%);
    color: rgba(0, 0, 0, .40);                 /* คุม currentColor ของภาพวาด */
}
.cfk-art { width: 64%; height: 64%; }
.cfk-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* ลิงก์รูปตาย → ซ่อน img แล้วเผยภาพวาดที่รออยู่ข้างใต้ */
.cfk-media.is-broken .cfk-img { display: none; }
body.cfk-noart .cfk-media { display: none; }

/* ══════════════════════════════════════════════════════════
   1. ATTRACT
   ══════════════════════════════════════════════════════════ */
.cfk-attract {
    grid-row: 1 / -1; display: grid; cursor: pointer;
    border: 0; padding: 0; font-family: inherit; text-align: center;
    background: #fff; width: 100%; height: 100%;
}
body.cfk-portrait  .cfk-attract { grid-template-rows: 1fr auto; }
body.cfk-landscape .cfk-attract { grid-template-columns: 1fr 1fr; align-items: center; }

.cfk-attract-strip { height: 5px; background: linear-gradient(90deg,
    var(--primary) 0%, var(--primary) 55%, var(--blue) 55%, var(--blue) 100%); }

.cfk-attract-mid {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 1.6); padding: var(--pad);
}
.cfk-attract-mark {
    width: calc(var(--u) * 11); height: calc(var(--u) * 11);
    border-radius: calc(var(--u) * 2.4); background: var(--primary);
    display: grid; place-items: center;
}
.cfk-attract-mark svg { width: 56%; height: 56%; }
.cfk-attract-shop { font-size: calc(var(--u) * 4.4); font-weight: 700; color: #111; line-height: 1.15; }
.cfk-attract-sub  { font-size: calc(var(--u) * 1.8); color: var(--text-muted); }
.cfk-attract-cta {
    margin-top: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1.8) calc(var(--u) * 4);
    background: var(--primary); color: #fff; border-radius: 999px;
    font-size: calc(var(--u) * 2.4); font-weight: 700;
    animation: cfk-breathe 2.4s ease-in-out infinite;
}
@keyframes cfk-breathe { 0%, 100% { opacity: 1 } 50% { opacity: .62 } }

.cfk-attract-band { overflow: hidden; padding-bottom: calc(var(--u) * 2.4); }
.cfk-attract-row { display: flex; gap: var(--gap); width: max-content;
                   animation: cfk-marquee 32s linear infinite; }
@keyframes cfk-marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }
.cfk-attract-tile {
    width: calc(var(--u) * 15); aspect-ratio: 1; border-radius: var(--r);
    overflow: hidden; flex-shrink: 0;
}
.cfk-attract-tile .cfk-media { width: 100%; height: 100%; }
body.cfk-landscape .cfk-attract-band { padding: var(--pad); }
body.cfk-landscape .cfk-attract-row { animation: none; flex-wrap: wrap; width: auto;
                                      justify-content: center; }

@media (prefers-reduced-motion: reduce) {
    .cfk-attract-cta, .cfk-attract-row { animation: none; }
}

/* ══════════════════════════════════════════════════════════
   2. ตัวเลือกใหญ่ (กินที่ร้าน/กลับบ้าน · เงินสด/QR)
   ══════════════════════════════════════════════════════════ */
.cfk-choices {
    display: grid; gap: var(--gap); padding: var(--pad);
    align-content: center; justify-content: stretch; min-height: 0; overflow-y: auto;
}
body.cfk-portrait  .cfk-choices { grid-auto-rows: max-content; }
body.cfk-landscape .cfk-choices { grid-template-columns: 1fr 1fr; align-items: center; }

.cfk-bigchoice {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 1.2); cursor: pointer; font-family: inherit;
    padding: calc(var(--u) * 3); min-height: calc(var(--u) * 22);
    background: #fff; border: 0.8px solid var(--brand-border);
    border-radius: calc(var(--u) * 1.8);
}
.cfk-bigchoice:active { border-color: var(--primary); background: var(--primary-bg); }
.cfk-bigchoice .cfk-media {
    width: calc(var(--u) * 16); height: calc(var(--u) * 16);
    border-radius: calc(var(--u) * 2);
}
.cfk-bigchoice .cfk-ic { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); color: var(--primary-dark); }
.cfk-bigchoice b     { font-size: calc(var(--u) * 2.6); font-weight: 700; color: #111; }
.cfk-bigchoice small { font-size: calc(var(--u) * 1.5); color: var(--text-muted); }

/* ══════════════════════════════════════════════════════════
   3. MENU
   ══════════════════════════════════════════════════════════ */
body.cfk-portrait  .cfk-menu { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
body.cfk-landscape .cfk-menu { display: grid;
    grid-template-columns: calc(var(--u) * 21) 1fr calc(var(--u) * 33);
    min-height: 0; }

/* หมวด — แนวตั้ง: แถบเลื่อนแนวนอน */
.cfk-catstrip {
    position: relative; display: flex; gap: calc(var(--u) * .9);
    padding: calc(var(--u) * 1.4) var(--pad);
    background: #fff; border-bottom: 0.8px solid var(--brand-border);
    overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity;
}
.cfk-catstrip::-webkit-scrollbar { display: none; }
/* บอกว่ายังเลื่อนไปได้อีก — ไม่งั้นหมวดท้าย ๆ ไม่มีใครรู้ว่ามี */
.cfk-catstrip::after {
    content: ''; position: sticky; right: 0; flex: 0 0 calc(var(--u) * 3); margin-right: calc(var(--u) * -2);
    align-self: stretch; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff 75%);
}
.cfk-cat {
    flex-shrink: 0; scroll-snap-align: center; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    padding: calc(var(--u) * 1.1) calc(var(--u) * 1.8);
    min-height: calc(var(--u) * 5);
    background: var(--surface-1); border: 0.8px solid var(--brand-border);
    border-radius: 999px; text-align: left;
}
.cfk-cat b     { font-size: calc(var(--u) * 1.75); font-weight: 700; color: #111; white-space: nowrap; }
.cfk-cat small { font-size: calc(var(--u) * 1.15); color: var(--text-light); white-space: nowrap; }
.cfk-cat.active { background: var(--primary); border-color: var(--primary); }
.cfk-cat.active b, .cfk-cat.active small { color: #fff; }

/* หมวด — แนวนอน: รางซ้าย */
.cfk-rail {
    display: flex; flex-direction: column; gap: calc(var(--u) * .6);
    padding: var(--pad) calc(var(--u) * 1.2);
    background: #fff; border-right: 0.8px solid var(--brand-border);
    overflow-y: auto; min-height: 0;
}
.cfk-rail .cfk-cat { width: 100%; border-radius: var(--r); scroll-snap-align: none; }

/* กริดสินค้า */
.cfk-gridwrap { overflow-y: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
.cfk-groupbar {
    position: sticky; top: 0; z-index: 2;
    padding: calc(var(--u) * 1.6) var(--pad) calc(var(--u) * .9);
    background: var(--brand-bg);
    font-size: calc(var(--u) * 1.4); font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text-muted);
}
.cfk-grid { display: grid; gap: var(--gap); padding: 0 var(--pad) var(--pad); }
body.cfk-portrait  .cfk-grid { grid-template-columns: repeat(2, 1fr); }
body.cfk-landscape .cfk-grid { grid-template-columns: repeat(auto-fill, minmax(calc(var(--u) * 21), 1fr)); }

.cfk-card {
    position: relative; display: flex; flex-direction: column; cursor: pointer;
    padding: 0; text-align: left; font-family: inherit; overflow: hidden;
    background: #fff; border: 0.8px solid var(--brand-border);
    border-radius: calc(var(--u) * 1.4);
}
.cfk-card:active:not(:disabled) { border-color: var(--primary); background: var(--primary-bg); }
.cfk-card .cfk-media { width: 100%; }
body.cfk-portrait  .cfk-card .cfk-media { aspect-ratio: 4 / 3; }
body.cfk-landscape .cfk-card .cfk-media { aspect-ratio: 4 / 3; }

.cfk-card-body {
    flex: 1; display: flex; flex-direction: column; gap: calc(var(--u) * .3);
    padding: calc(var(--u) * 1.3) calc(var(--u) * 1.4) calc(var(--u) * 1.4);
    background: #fff; border-top: 0.8px solid rgba(0, 0, 0, .05);
}
body.cfk-noart .cfk-card-body { border-top: 0; min-height: calc(var(--u) * 13); }
.cfk-card-name {
    font-size: calc(var(--u) * 2); font-weight: 700; color: #111; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cfk-card-en { font-size: calc(var(--u) * 1.3); color: var(--text-light);
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cfk-card-foot {
    margin-top: auto; padding-top: calc(var(--u) * .9);
    display: flex; align-items: center; justify-content: space-between;
    gap: calc(var(--u) * .6); flex-wrap: wrap;
}
.cfk-serves { display: flex; gap: calc(var(--u) * .4); flex-wrap: wrap; }
.cfk-serve-pill {
    padding: calc(var(--u) * .25) calc(var(--u) * .9);
    background: var(--surface-1); border: 0.8px solid var(--brand-border);
    border-radius: 999px; font-size: calc(var(--u) * 1.15);
    font-weight: 700; color: var(--text-muted);
}
.cfk-price { font-size: calc(var(--u) * 2.2); font-weight: 800;
             color: var(--primary-dark); white-space: nowrap; }
.cfk-price small { font-size: calc(var(--u) * 1.3); font-weight: 700; color: var(--text-muted); }

.cfk-card:disabled { cursor: not-allowed; }
.cfk-card:disabled .cfk-media, .cfk-card:disabled .cfk-card-body { opacity: .4; }
.cfk-badge {
    position: absolute; top: calc(var(--u) * .9); left: calc(var(--u) * .9); z-index: 1;
    padding: calc(var(--u) * .35) calc(var(--u) * 1); border-radius: 999px;
    font-size: calc(var(--u) * 1.15); font-weight: 700;
}
.cfk-badge-reco { background: var(--blue); color: #fff; }
.cfk-badge-out  { left: auto; right: calc(var(--u) * .9); background: var(--status-danger); color: #fff; }

/* ══════════════════════════════════════════════════════════
   4. ตะกร้า — อยู่ที่เดิมเสมอ ไม่เคยหาย
   ══════════════════════════════════════════════════════════ */
.cfk-cartbar {
    display: flex; align-items: center; gap: var(--gap); padding: var(--pad);
    background: #fff; border-top: 0.8px solid var(--brand-border);
}
.cfk-cartbar-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cfk-cartbar-info span   { font-size: calc(var(--u) * 1.4); color: var(--text-muted); }
.cfk-cartbar-info strong { font-size: calc(var(--u) * 2.8); font-weight: 800; color: #111;
                           font-variant-numeric: tabular-nums; }
.cfk-cartbar.is-empty .cfk-cartbar-info strong { color: var(--text-light); }

/* แผงตะกร้าขวา (แนวนอน) */
.cfk-cartpanel {
    display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
    background: #fff; border-left: 0.8px solid var(--brand-border);
}
.cfk-cartpanel-head {
    padding: var(--pad); border-bottom: 0.8px solid var(--brand-border);
    font-size: calc(var(--u) * 2); font-weight: 700; color: #111;
}
.cfk-cartpanel-list { overflow-y: auto; min-height: 0; padding: 0 var(--pad); }
.cfk-cartpanel-foot { padding: var(--pad); border-top: 0.8px solid var(--brand-border);
                      display: grid; gap: calc(var(--u) * 1); }

.cfk-cartline {
    display: flex; gap: calc(var(--u) * 1.2); align-items: flex-start;
    padding: calc(var(--u) * 1.4) 0; border-bottom: 0.8px solid var(--border-light);
}
.cfk-cartline .cfk-media {
    width: calc(var(--u) * 7); height: calc(var(--u) * 7);
    border-radius: var(--r); flex-shrink: 0;
}
.cfk-cartline-mid { flex: 1; min-width: 0; }
.cfk-cartline-name { font-size: calc(var(--u) * 1.75); font-weight: 700; color: #111; }
.cfk-cartline-mods { font-size: calc(var(--u) * 1.35); color: var(--text-muted); line-height: 1.45; }
.cfk-cartline-end  { text-align: right; flex-shrink: 0; }
.cfk-cartline-amt  { font-size: calc(var(--u) * 1.8); font-weight: 700; color: #111;
                     font-variant-numeric: tabular-nums; }
.cfk-cartline-act  { display: flex; gap: calc(var(--u) * .6); margin-top: calc(var(--u) * .8); }

.cfk-mini {
    display: inline-flex; align-items: center; gap: calc(var(--u) * .4);
    padding: calc(var(--u) * .7) calc(var(--u) * 1.2); cursor: pointer; font-family: inherit;
    background: #fff; border: 0.8px solid var(--brand-border); border-radius: var(--r);
    font-size: calc(var(--u) * 1.35); font-weight: 700; color: var(--text-secondary);
    min-height: calc(var(--u) * 5); min-width: calc(var(--u) * 5);
    justify-content: center;
}
.cfk-mini .cfk-ic { width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); }
.cfk-mini:active { background: var(--brand-bg); }

.cfk-total {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: var(--pad); background: #fff;
}
.cfk-total span   { font-size: calc(var(--u) * 1.8); color: var(--text-muted); }
.cfk-total strong { font-size: calc(var(--u) * 3.2); font-weight: 800; color: #111;
                    font-variant-numeric: tabular-nums; }

.cfk-empty {
    display: grid; place-items: center; gap: calc(var(--u) * 1);
    padding: calc(var(--u) * 5) var(--pad); text-align: center;
    color: var(--text-light); font-size: calc(var(--u) * 1.7);
}

/* ══════════════════════════════════════════════════════════
   5. รายละเอียดสินค้า
   ══════════════════════════════════════════════════════════ */
body.cfk-portrait  .cfk-item { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
body.cfk-landscape .cfk-item { display: grid; grid-template-rows: auto 1fr auto;
                               grid-template-columns: 1fr 1.25fr; }
body.cfk-landscape .cfk-item > .cfk-top      { grid-column: 1 / -1; }
body.cfk-landscape .cfk-item > .cfk-actionbar { grid-column: 1 / -1; }

.cfk-item-left { padding: var(--pad); overflow-y: auto; min-height: 0; }
.cfk-item-scroll { overflow-y: auto; min-height: 0; padding: 0 var(--pad) var(--pad); }
body.cfk-portrait .cfk-item-left { display: contents; }
body.cfk-landscape .cfk-item-scroll { padding-top: var(--pad); }

.cfk-hero { width: 100%; border-radius: calc(var(--u) * 1.6); overflow: hidden; }
/* แนวตั้ง: รูปเป็นแถบเตี้ย ๆ — ตัวเลือกทั้งหมดต้องอยู่ในจอเดียวโดยไม่ต้องเลื่อน */
body.cfk-portrait  .cfk-hero { height: calc(var(--u) * 15); margin: var(--pad) var(--pad) calc(var(--u) * .4);
                               width: auto; }
body.cfk-landscape .cfk-hero { aspect-ratio: 1 / 1; }
.cfk-hero .cfk-media { width: 100%; height: 100%; }

.cfk-item-name { font-size: calc(var(--u) * 2.3); font-weight: 700; color: #111; line-height: 1.25; }
.cfk-item-en   { font-size: calc(var(--u) * 1.4); color: var(--text-light);
                 margin-bottom: calc(var(--u) * .4); }
.cfk-item-eyebrow { font-size: calc(var(--u) * 1.3); font-weight: 700; letter-spacing: .06em;
                    text-transform: uppercase; color: var(--text-muted); }

.cfk-optgroup { margin-top: calc(var(--u) * 1.3); }
.cfk-optgroup-head {
    display: flex; align-items: center; gap: calc(var(--u) * .8); flex-wrap: wrap;
    margin-bottom: calc(var(--u) * .6);
}
.cfk-optgroup-head b { font-size: calc(var(--u) * 1.6); font-weight: 700; color: #111; }
.cfk-tag {
    padding: calc(var(--u) * .25) calc(var(--u) * .9); border-radius: 999px;
    font-size: calc(var(--u) * 1.15); font-weight: 700;
    background: var(--surface-1); color: var(--text-muted);
    border: 0.8px solid var(--brand-border);
}
.cfk-tag-req { background: var(--brand-amber-50); color: #8A6400; border-color: #FDE68A; }

/* ตัวเลือกเป็นปุ่มกลม เรียงต่อกันในบรรทัดเดียว (สูงสุด 6 ปุ่มต่อบรรทัด)
   ปุ่มกว้างอย่างน้อย 1/6 ของแถว ชื่อยาวก็ขยายกว้างขึ้นเอง ไม่ตัดคำ */
.cfk-opts { --gap: calc(var(--u) * .7); display: flex; flex-wrap: wrap; gap: var(--gap); }
.cfk-opt {
    flex: 0 1 auto; min-width: calc((100% - 5 * var(--gap)) / 6);
    display: inline-flex; align-items: center; justify-content: center;
    gap: calc(var(--u) * .5); cursor: pointer; font-family: inherit; text-align: center;
    padding: calc(var(--u) * .7) calc(var(--u) * 1.3);
    min-height: calc(var(--u) * 4.4);
    background: #fff; border: 0.8px solid var(--brand-border); border-radius: 999px;
    font-size: calc(var(--u) * 1.45); font-weight: 600; color: #111; line-height: 1.2;
}
.cfk-opt b { flex-shrink: 0; font-size: calc(var(--u) * 1.25); color: var(--primary-dark); }
.cfk-opt.active { background: var(--primary-bg); border-color: var(--primary);
                  color: var(--primary-dark); font-weight: 700; }
.cfk-optgroup.is-missing .cfk-optgroup-head b { color: var(--status-danger); }
.cfk-optgroup.is-missing .cfk-opt { border-color: #FFC9CE; }

/* ปุ่มแบบเสิร์ฟ — ราคาโชว์ใต้ชื่อ เห็นก่อนกด */
.cfk-serves-pick { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .7); }
.cfk-serve {
    flex: 1 1 0; display: flex; align-items: center; justify-content: center;
    gap: calc(var(--u) * .7);
    cursor: pointer; font-family: inherit; min-height: calc(var(--u) * 4.8);
    padding: calc(var(--u) * .7) calc(var(--u) * 1.4);
    background: #fff; border: 0.8px solid var(--brand-border); border-radius: 999px;
}
.cfk-serve b     { font-size: calc(var(--u) * 1.7); font-weight: 700; color: #111; }
.cfk-serve small { font-size: calc(var(--u) * 1.4); font-weight: 600; color: var(--text-muted); }
.cfk-serve.active { background: var(--primary); border-color: var(--primary); }
.cfk-serve.active b, .cfk-serve.active small { color: #fff; }

.cfk-qty { display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
.cfk-qty button {
    width: calc(var(--u) * 4.8); height: calc(var(--u) * 4.8); cursor: pointer;
    display: grid; place-items: center; font-family: inherit;
    background: #fff; border: 0.8px solid var(--brand-border); border-radius: 50%; color: #111;
}
/* จำนวนอยู่บรรทัดเดียวกับหัวข้อ — ประหยัดความสูงอีกหนึ่งแถว */
.cfk-optgroup-qty { display: flex; align-items: center; justify-content: space-between; }
.cfk-optgroup-qty .cfk-optgroup-head { margin-bottom: 0; }
.cfk-qty button:disabled { opacity: .35; pointer-events: none; }
.cfk-qty button .cfk-ic { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); }
.cfk-qty output { font-size: calc(var(--u) * 2.6); font-weight: 800; color: #111;
                  min-width: calc(var(--u) * 4); text-align: center;
                  font-variant-numeric: tabular-nums; }

/* ══════════════════════════════════════════════════════════
   6. UPSELL — ครั้งเดียวต่อออเดอร์
   ══════════════════════════════════════════════════════════ */
.cfk-upsell { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
.cfk-upsell-head { padding: var(--pad) var(--pad) 0; }
.cfk-upsell-head b { display: block; font-size: calc(var(--u) * 2.6); font-weight: 700; color: #111; }
.cfk-upsell-head span { font-size: calc(var(--u) * 1.6); color: var(--text-muted); }
.cfk-upgrid { display: grid; gap: var(--gap); padding: var(--pad); overflow-y: auto; min-height: 0; }
body.cfk-portrait  .cfk-upgrid { grid-template-columns: repeat(2, 1fr); align-content: start; }
body.cfk-landscape .cfk-upgrid { grid-template-columns: repeat(4, 1fr); align-content: center; }
.cfk-upcard.is-added { border-color: var(--primary); background: var(--primary-bg); }
.cfk-upcard.is-added .cfk-price { color: var(--primary-dark); }

/* ══════════════════════════════════════════════════════════
   7. ชำระเงิน / QR / เสร็จสิ้น
   ══════════════════════════════════════════════════════════ */
.cfk-paytotal {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: var(--pad); padding: calc(var(--u) * 2);
    background: #fff; border: 0.8px solid var(--brand-border); border-radius: calc(var(--u) * 1.4);
}
.cfk-paytotal span   { font-size: calc(var(--u) * 1.7); color: var(--text-muted); }
.cfk-paytotal strong { font-size: calc(var(--u) * 4); font-weight: 800; color: #111;
                       font-variant-numeric: tabular-nums; }

.cfk-center {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 1.4); padding: var(--pad); text-align: center;
    overflow-y: auto; min-height: 0;
}
.cfk-qr {
    width: calc(var(--u) * 26); aspect-ratio: 1; display: grid; place-items: center;
    gap: calc(var(--u) * .8); border: 3px dashed var(--brand-border-strong);
    border-radius: calc(var(--u) * 1.6); color: var(--text-light); background: #fff;
}
.cfk-qr .cfk-ic { width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
.cfk-qr span { font-size: calc(var(--u) * 1.3); }

/* พอมี QR จริงแล้ว กรอบเส้นประของ placeholder ไม่จำเป็นอีก และ aspect-ratio
   ที่ล็อกเป็นสี่เหลี่ยมจัตุรัสจะบีบให้คำอธิบายทับตัวโค้ด */
.cfk-qr.has-qr {
    width: auto; aspect-ratio: auto; border: 0; background: transparent;
    gap: calc(var(--u) * 1.2); color: var(--text-secondary);
}

.cfk-done-ico {
    width: calc(var(--u) * 9); height: calc(var(--u) * 9); border-radius: 50%;
    display: grid; place-items: center;
}
.cfk-done-ico .cfk-ic { width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); }
.cfk-done-ico.ok   { background: var(--primary-bg); color: var(--primary-dark); }
.cfk-done-ico.warn { background: var(--brand-amber-50); color: #8A6400; }
.cfk-done-label { font-size: calc(var(--u) * 1.8); color: var(--text-muted); }
.cfk-done-no {
    font-size: calc(var(--u) * 16); font-weight: 800; color: #111;
    line-height: 1.05; letter-spacing: .02em; font-variant-numeric: tabular-nums;
}
.cfk-done-timer { font-size: calc(var(--u) * 1.5); color: var(--text-light); }
.cfk-countdown { font-size: calc(var(--u) * 2.2); font-weight: 800; color: var(--primary-dark);
                 font-variant-numeric: tabular-nums; }

/* ══════════════════════════════════════════════════════════
   8. แผ่นยืนยัน + toast — อยู่ "ในเวที" ไม่ใช่ในหน้าต่าง
      (drawer ของ DS เป็น position:fixed ผูกกับหน้าต่าง จะทะลุกรอบจำลอง)
   ══════════════════════════════════════════════════════════ */
.cfk-sheet {
    position: absolute; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: var(--pad);
    background: rgba(17, 17, 17, .5);
}
.cfk-sheet-box {
    width: 100%; max-width: calc(var(--u) * 42);
    background: #fff; border-radius: calc(var(--u) * 1.8);
    border: 0.8px solid var(--brand-border); overflow: hidden;
}
.cfk-sheet-body { padding: calc(var(--u) * 2.4); text-align: center; }
.cfk-sheet-body b { display: block; font-size: calc(var(--u) * 2.2); font-weight: 700;
                    color: #111; margin-bottom: calc(var(--u) * .8); }
.cfk-sheet-body p { margin: 0; font-size: calc(var(--u) * 1.6); color: var(--text-muted); }

.cfk-toast {
    position: absolute; left: 50%; bottom: calc(var(--u) * 12); z-index: 60;
    transform: translate(-50%, calc(var(--u) * 1.4));
    padding: calc(var(--u) * 1.2) calc(var(--u) * 2.4); border-radius: 999px;
    background: #111; color: #fff; font-size: calc(var(--u) * 1.6); font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    max-width: 86%; text-align: center;
}
.cfk-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ป้ายบอกว่านี่คือเดโม */
.cfk-demoonly {
    position: absolute; top: calc(var(--u) * 1); right: calc(var(--u) * 1); z-index: 40;
    padding: calc(var(--u) * .4) calc(var(--u) * 1); border-radius: 999px;
    background: rgba(17, 17, 17, .6); color: #fff;
    font-size: calc(var(--u) * 1.1); font-weight: 700; pointer-events: none;
}

/* ══════════════════════════════════════════════════════════
   9. หน้าเลือกเครื่อง — เฉพาะเว็บแอป ไม่มีในอาร์ติแฟกต์
   ══════════════════════════════════════════════════════════ */
.cf-kiosk-gate[hidden] { display: none !important; }
.cf-kiosk-gate {
    position: fixed; inset: 0; z-index: 2000; background: #F7F7F7;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    font-size: 15px;
}
.cf-kiosk-gate-card {
    background: #fff; border: 0.8px solid var(--brand-border); border-radius: 12px;
    padding: 32px; width: 100%; max-width: 460px; position: relative; overflow: hidden;
}
.cf-kiosk-gate-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #06C755 0%, #06C755 55%, #3579EA 55%, #3579EA 100%);
}
.cf-kiosk-gate-card h2 { font-size: 22px; font-weight: 700; color: #111; margin: 0 0 4px; }
.cf-kiosk-gate-card p  { font-size: 14px; color: var(--text-muted); margin: 0 0 18px; }
.cf-kiosk-gate-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer; text-align: left; font-family: inherit;
    background: #fff; border: 0.8px solid var(--brand-border); border-radius: 10px;
}
.cf-kiosk-gate-btn:hover  { border-color: var(--primary); background: var(--primary-bg); }
.cf-kiosk-gate-btn strong { display: block; font-size: 15px; color: #111; }
.cf-kiosk-gate-btn small  { font-size: 12px; color: var(--text-muted); }
.cf-gate-chip {
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: var(--surface-1); color: var(--text-muted);
    border: 0.8px solid var(--brand-border); white-space: nowrap;
}
.cf-gate-chip.ok { background: var(--primary-bg); color: var(--primary-dark); border-color: var(--primary-border); }
.cf-kiosk-gate-link {
    display: block; margin-top: 16px; text-align: center;
    font-size: 13px; color: var(--text-muted); text-decoration: none;
}
.cf-kiosk-gate-link:hover { color: var(--primary-dark); }

/* ม่านระหว่างรอเซิร์ฟเวอร์ — ต้องกันการกดจริง ไม่ใช่แค่บอกว่ากำลังรอ
   ไม่งั้นลูกค้ากดรัวแล้วได้หลายออเดอร์ */
.cfk-busy {
    position: absolute; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .86);
    font-size: calc(var(--u) * 2); font-weight: 700; color: var(--primary-dark);
}

/* QR จริงจากเซิร์ฟเวอร์ — ต้องใหญ่พอให้กล้องมือถือจับได้จากระยะยืน
   พื้นขาวรอบโค้ดเป็นส่วนหนึ่งของมาตรฐาน ห้ามตัดทิ้งเพื่อความสวย */
.cfk-qr-img {
    width: calc(var(--u) * 26); height: calc(var(--u) * 26);
    background: #fff; padding: calc(var(--u) * 1.2);
    border: 0.8px solid var(--brand-border); border-radius: var(--r);
    display: grid; place-items: center;
}
.cfk-qr-img svg { width: 100%; height: 100%; display: block; }

/* ══════════════════════════════════════════════════════════
   หน้าจับคู่อุปกรณ์ (§30)
   พนักงานพิมพ์บนจอสัมผัส ช่องกรอกจึงต้องใหญ่และเว้นตัวอักษรให้อ่านง่าย
   ══════════════════════════════════════════════════════════ */
.cf-pair-box { display: grid; gap: 14px; }
.cf-pair-input {
    width: 100%; padding: 18px 20px;
    font-family: inherit; font-size: 34px; font-weight: 800;
    letter-spacing: .28em; text-align: center; text-transform: uppercase;
    color: #111; background: #fff;
    border: 0.8px solid var(--brand-border); border-radius: 12px;
}
.cf-pair-input:focus { outline: 3px solid var(--primary-border); outline-offset: 2px; }
.cf-pair-btn { justify-content: center; font-weight: 700; }
.cf-pair-msg {
    min-height: 22px; text-align: center;
    font-size: 15px; color: var(--text-secondary);
}

/* ══════════════════════════════════════════════════════════
   หน้าชำระ QR + กล้องตรวจสลิป (§17) — หน้าเดียวจบ
   แถวบน: QR | ภาพตัวอย่างวิธียกสลิป · ล่าง: กล้องจริง + ปุ่มถ่าย/ถ่ายใหม่
   แนวนอน: แถวบนอยู่ซ้าย กล้องอยู่ขวา
   ══════════════════════════════════════════════════════════ */
.cfk-paygrid.has-cam { justify-content: flex-start; gap: calc(var(--u) * 1.4); }
.cfk-paycol {
    display: flex; flex-direction: column; align-items: center;
    gap: calc(var(--u) * 1.1); width: 100%;
}
.cfk-payrow { display: contents; }
.cfk-paygrid.has-cam .cfk-payrow {
    display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 1.4);
    width: 100%; align-items: stretch;
}
.cfk-paygrid.has-cam .cfk-payrow > .cfk-paycol { width: auto; justify-content: center; }
.cfk-paygrid.has-cam .cfk-qr-img { width: calc(var(--u) * 20); height: calc(var(--u) * 20); }
.cfk-paygrid.has-cam .cfk-qr:not(.has-qr) { width: calc(var(--u) * 20); }
.cfk-payamt { font-size: calc(var(--u) * 5); }
.cfk-paygrid.has-cam .cfk-payamt { font-size: calc(var(--u) * 4); }

body.cfk-landscape .cfk-paygrid.has-cam {
    display: grid; grid-template-columns: 1.1fr 1fr; align-items: center;
}

/* ── การ์ดตัวอย่างข้าง QR ── */
.cfk-guide {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    gap: calc(var(--u) * 1); padding: calc(var(--u) * 1.4);
    border-radius: calc(var(--u) * 1.6);
    background: radial-gradient(circle at 50% 110%, #4b5563 0 45%, transparent 46%),
                linear-gradient(#4b5563, #2b3036);
    color: #fff;
}
.cfk-guide-title { font-size: calc(var(--u) * 1.6); font-weight: 800; text-align: center; }
.cfk-guide-stage {
    position: relative; flex: 1; width: 100%; min-height: calc(var(--u) * 20);
    display: grid; place-items: center;
}
.cfk-guide-aim { position: absolute; inset: 2% 18%; }
.cfk-guide-aim i {
    position: absolute; width: 20%; height: 16%;
    border: 4px solid rgba(255, 255, 255, .7);
}
.cfk-guide-aim i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
.cfk-guide-aim i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
.cfk-guide-aim i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
.cfk-guide-aim i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
.cfk-guide-phone {
    position: relative; height: calc(var(--u) * 19); width: auto;
    filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .45));
    animation: cfk-guide-in 3.2s ease-in-out infinite;
}
.cfk-guide-qr { animation: cfk-guide-qr 1.6s ease-in-out infinite; transform-origin: 89px 157px; }
.cfk-guide-tips { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * .5); }
.cfk-guide-tips span {
    padding: calc(var(--u) * .4) calc(var(--u) * .9); border-radius: 999px;
    background: rgba(255, 255, 255, .92); color: #111;
    font-size: calc(var(--u) * 1.15); font-weight: 700; white-space: nowrap;
}
/* ยกมือถือเข้ามาในกรอบ → ค้าง → ถอยออก วนซ้ำ */
@keyframes cfk-guide-in {
    0%   { transform: translate(-30%, 18%) rotate(-10deg) scale(.86); opacity: 0; }
    25%  { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
    75%  { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
    100% { transform: translate(-30%, 18%) rotate(-10deg) scale(.86); opacity: 0; }
}
@keyframes cfk-guide-qr { 50% { transform: scale(1.12); } }

/* ── ตัวชี้ลอยเหนือกล้อง ── */
.cfk-cam-point {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: calc(var(--u) * -0.8);
    font-size: calc(var(--u) * 1.5); font-weight: 800;
    animation: cfk-point 1.2s ease-in-out infinite;
}
.cfk-cam-point span {
    padding: calc(var(--u) * .5) calc(var(--u) * 1.3); border-radius: 999px;
    background: var(--primary); color: #fff;
}
.cfk-cam-point svg { width: calc(var(--u) * 3); height: calc(var(--u) * 3); color: var(--primary); }
@keyframes cfk-point {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(calc(var(--u) * .9)); }
}

/* ── กล้องจริง — สถานะอยู่ที่ data-state: starting · scan · checking · fail · nocam · demo ── */
.cfk-cam {
    position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden;
    border-radius: calc(var(--u) * 1.6); background: #111;
    border: 3px solid transparent; transition: border-color .15s;
}
.cfk-cam video, .cfk-cam img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    /* กลับซ้าย-ขวาเฉพาะที่แสดง ให้ลูกค้าเล็งเหมือนส่องกระจก
       ภาพที่ส่งตรวจถ่ายจาก video ตรง ๆ จึงไม่กลับ — ตัวหนังสือบนสลิปยังอ่านได้ */
    transform: scaleX(-1);
}
.cfk-cam img { display: none; }
.cfk-cam[data-state="checking"] img,
.cfk-cam[data-state="fail"] img { display: block; }
.cfk-cam[data-state="checking"] img { filter: brightness(.55); }
.cfk-cam[data-state="fail"] img { filter: brightness(.4) saturate(.5); }

.cfk-cam-aim { position: absolute; inset: 12% 24%; pointer-events: none; }
.cfk-cam-aim i {
    position: absolute; width: 18%; height: 18%;
    border: 4px solid rgba(255, 255, 255, .85); transition: border-color .15s;
}
.cfk-cam-aim i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
.cfk-cam-aim i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
.cfk-cam-aim i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
.cfk-cam-aim i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
.cfk-cam.is-found { border-color: var(--primary); }
.cfk-cam.is-found .cfk-cam-aim i { border-color: var(--primary); }
.cfk-cam:not([data-state="scan"]) .cfk-cam-aim { display: none; }

.cfk-cam-msg {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * .8);
    padding: calc(var(--u) * 1.1) calc(var(--u) * 1.4);
    background: linear-gradient(transparent, rgba(0, 0, 0, .72));
    color: #fff; font-size: calc(var(--u) * 1.5); font-weight: 600; text-align: center;
}

window.CFStore = (function () {
    let db = null;
    const subs = [];
    return {
        get db() { return db; },
        init() { if (!db) db = CF_SEED(new Date()); return db; },
        all(e) { return (db && db[e]) || []; },
        byId(e, i) { return this.all(e).find((x) => x.id === i) || null; },
        where(e, f) { return this.all(e).filter(f); },
        settings() { return db.settings; },
        openShift() { return this.all('shifts').find((s) => s.status === 'OPEN') || null; },
        nextId(p, k) { const n = (db.counters[k] || 0) + 1; db.counters[k] = n; return p + n; },
        nextOrderNo() {
            const n = (db.counters.orderSeq || 100) + 1;
            db.counters.orderSeq = n;
            return 'A' + String(n).padStart(3, '0');

        mutate(fn, reason) {
            const v = fn(db);
            db.meta.rev = (db.meta.rev || 0) + 1;

        subscribe(cb) { subs.push(cb); return () => {}; },
        resetDemo() { db = CF_SEED(new Date()); subs.forEach((cb) => cb({ rev: 0 })); },
        isPersistent() { return true; },
    };
})();

/**

 * ------------------------------------------------------------
 * สูตรคิดราคาชุดเดียวของทั้งระบบ ถ้าเบราว์เซอร์กับเซิร์ฟเวอร์คิดคนละแบบเมื่อไหร่
 * ราคาที่ลูกค้าเห็นกับที่ร้านเก็บเงินจะไม่ตรงกัน — นั่นคือบั๊กที่ลูกค้าจับได้ก่อนเรา
 *
 * **สินค้าเก็บราคาเป็น sparse map `prices: {HOT:50, ICED:50}`
 *   คีย์ที่ไม่มี = ไม่มีขายแบบนั้น ('–' บนป้ายหน้าร้าน) ซึ่งต่างจากราคา 0**
 *
 * ⚠️ ตรรกะบริสุทธิ์เท่านั้น — ห้ามอ้าง window / CFStore / fetch
 */

    const m = factory();
    if (typeof module === 'object' && module.exports) module.exports = m;
    else Object.keys(m).forEach((k) => { root[k] = m[k]; });

    'use strict';

    const ORDER = ['HOT', 'ICED', 'FRAPPE', 'STD'];

    /** แบบเสิร์ฟที่สินค้านี้มีขายจริง เรียงตามลำดับบนป้าย */
    function serveTypesOf(product) {
        if (!product || !product.prices) return [];
        return ORDER.filter((k) => product.prices[k] != null);
    }

    /**
     * ทางเดียวที่อ่านราคาสินค้า — ห้ามอ่าน product.price ตรง ๆ ที่ไหนอีก
     * คืน null เมื่อแบบเสิร์ฟนั้นไม่มีขาย ซึ่งต่างจากราคา 0
     */
    function priceOf(product, serveType) {
        if (!product || !product.prices) return null;
        if (serveType && product.prices[serveType] != null) return product.prices[serveType];
        if (serveType) return null;
        const first = serveTypesOf(product)[0];
        return first ? product.prices[first] : null;
    }

    /** ราคาต่ำสุดของสินค้า — ใช้แสดง "เริ่มต้น ฿xx" บนการ์ดคีออสก์ */
    function minPriceOf(product) {
        const vals = serveTypesOf(product).map((k) => product.prices[k]);
        return vals.length ? Math.min.apply(null, vals) : 0;
    }

    /** ราคาต่อหน่วยหลังรวมส่วนเพิ่มของตัวเลือก */
    function unitPriceOf(product, serveType, mods) {

        if (base == null) return null;
        return base + (mods || []).reduce((s, m) => s + (m.priceDelta || 0), 0);

    function lineTotal(product, serveType, mods, qty) {
        const unit = unitPriceOf(product, serveType, mods);
        return unit == null ? 0 : unit * (qty || 1);

    function cartTotal(lines) {

    return { CFPricing: { serveTypesOf, priceOf, minPriceOf, unitPriceOf, lineTotal, cartTotal } };

/**
 * CafeFlow — กฎตัวเลือกสินค้า (§11)
 * ------------------------------------------------------------
 * ผูกกับ "แบบเสิร์ฟ" และ "หมวด" ไม่ใช่ hard-code ต่อสินค้า
 * ทั้งหน้าจัดการเมนู หน้าคีออสก์ และเซิร์ฟเวอร์ต้องใช้ชุดเดียวกัน
 * ถ้าสองที่คิดกฎต่างกันเมื่อไหร่ ตัวเลือกที่ลูกค้าเห็นกับที่ร้านตั้งจะไม่ตรงกัน
 *
 * ⚠️ รุ่นนี้เป็น pure — รับ `data` เข้ามาแทนการอ่าน CFStore ตรง ๆ
 *    เพราะเซิร์ฟเวอร์ไม่มี CFStore · ฝั่งเบราว์เซอร์มี adapter ใน cf-app.js
 *    ที่ฉีด CFStore.db ให้ ลายเซ็นที่หน้าเว็บเรียกอยู่จึงไม่เปลี่ยน
 *
 *    data = { modifierRules, modifierGroups, modifierOptions }  (array ทั้งสามตัว)
 */
(function (root, factory) {
    const m = factory();
    if (typeof module === 'object' && module.exports) module.exports = m;
    else Object.keys(m).forEach((k) => { root[k] = m[k]; });
})(typeof self !== 'undefined' ? self : this, function () {
    'use strict';

    const arr = (x) => (Array.isArray(x) ? x : []);

    /** กลุ่มตัวเลือกที่ต้องแสดง สำหรับสินค้า + แบบเสิร์ฟหนึ่ง ๆ */
    function groupsFor(serveType, categoryId, data) {
        data = data || {};
        const groups = arr(data.modifierGroups);
        const seen = {};
        return arr(data.modifierRules)
            .filter((r) => (r.serveType && r.serveType === serveType) ||
                           (r.categoryId && r.categoryId === categoryId))
            .sort((a, b) => a.sort - b.sort)
            .map((r) => groups.find((g) => g.id === r.groupId))
            .filter((g) => {
                if (!g || seen[g.id]) return false;
                seen[g.id] = true;
                return true;
            });
    }

    /** กลุ่มที่ถูกกฎซ่อน — ใช้อธิบายให้ผู้ใช้เห็นว่ามี rule engine อยู่จริง */
    function hiddenFor(serveType, categoryId, data) {
        const shown = {};
        groupsFor(serveType, categoryId, data).forEach((g) => { shown[g.id] = true; });
        return arr((data || {}).modifierGroups).filter((g) => !shown[g.id]);
    }

    function optionsOf(groupId, data) {
        return arr((data || {}).modifierOptions)
            .filter((o) => o.groupId === groupId)
            .sort((a, b) => a.sort - b.sort);
    }

    /** ตัวเลือกเริ่มต้นของสินค้า + แบบเสิร์ฟ — คีออสก์ใช้ตั้งค่าเริ่มต้นให้ลูกค้า */
    function defaultsFor(serveType, categoryId, data) {
        const out = [];
        groupsFor(serveType, categoryId, data).forEach((g) => {
            if (g.type !== 'SINGLE') return;
            const d = optionsOf(g.id, data).find((o) => o.isDefault);
            if (d) {
                out.push({
                    groupId: g.id, optionId: d.id, label: d.nameTh,
                    shortLabel: d.shortLabel, priceDelta: d.priceDelta,
                });
            }
        });
        return out;
    }

    /**
     * ตรวจว่าตัวเลือกที่ส่งมาถูกกฎไหม — เซิร์ฟเวอร์ใช้ตอนรับออเดอร์
     * คืน array ของข้อความปัญหา (ว่าง = ผ่าน)
     */
    function validate(serveType, categoryId, mods, data) {
        const problems = [];
        const groups = groupsFor(serveType, categoryId, data);
        const allowed = {};
        groups.forEach((g) => { optionsOf(g.id, data).forEach((o) => { allowed[o.id] = g; }); });

        arr(mods).forEach((m) => {
            if (!allowed[m.optionId]) problems.push('ตัวเลือก "' + (m.label || m.optionId) + '" ไม่ถูกกฎของสินค้านี้');
        });
        groups.forEach((g) => {
            const picked = arr(mods).filter((m) => m.groupId === g.id);
            if (g.required && picked.length === 0) problems.push('ต้องเลือก "' + g.nameTh + '"');
            if (g.type === 'SINGLE' && picked.length > 1) problems.push('"' + g.nameTh + '" เลือกได้อย่างเดียว');
        });
        return problems;
    }

    return { CFRulesCore: { groupsFor, hiddenFor, optionsOf, defaultsFor, validate } };
});

            ts: { paidAt: iso(mins - tWait), sentAt: iso(mins - tWait),
                  readyAt: iso(mins - tWait - tPrep), servedAt: iso(mins - tWait - tPrep - tPick) } });
        const amt = orders.find((o) => o.id === id).total;
        pay(id, method === 'CASH'
            ? { method: 'CASH', amount: amt, received: Math.ceil(amt / 100) * 100, change: Math.ceil(amt / 100) * 100 - amt, createdAt: iso(mins), verifiedBy: 'U-3' }
            : { method: 'QR', amount: amt, ref: 'TX20260919-87' + String(100 + i), bank: i % 2 ? 'SCB' : 'KBANK', txAt: iso(mins), verifiedBy: 'SYSTEM', createdAt: iso(mins) });
    }

    /* ── ยกเลิก + คืนเงิน (ให้ closing มีรายการหักจริง) ── */
    const cx = mkOrder({ no: 'A105', minsAgo: 33, kiosk: 'KIOSK-03', status: 'CANCELLED', method: 'CASH',
        items: [['P-SD3', 'FRAPPE', 1, ['MO-S50']]], cancelReason: 'ลูกค้ายกเลิก — รอนานเกินไป' });
    audit(cx, 'STATUS_CHANGE', 'WAITING_CASH', 'CANCELLED', 30, 'U-3', 'ลูกค้ายกเลิก — รอนานเกินไป');

    const rf = mkOrder({ no: 'A080', minsAgo: 256, kiosk: 'KIOSK-01', status: 'REFUNDED', method: 'QR',
        cashierId: 'U-3', items: [['P-HB5', 'ICED', 1, ['MO-S50', 'MO-I-N']]],
        cancelReason: 'ชงผิดรายการ — คืนเงินเต็มจำนวน',
        ts: { paidAt: iso(255) } });
    pay(rf, { method: 'QR', amount: 70, ref: 'TX20260919-87055', bank: 'KBANK', txAt: iso(255), verifiedBy: 'SYSTEM', status: 'REFUNDED', createdAt: iso(255) });
    audit(rf, 'STATUS_CHANGE', 'COMPLETED', 'REFUNDED', 240, 'U-2', 'ชงผิดรายการ — คืนเงินเต็มจำนวน');

    /* ── เรียงเหตุการณ์ใหม่ล่าสุดอยู่บน ── */
    auditLogs.sort((a, b) => (a.ts < b.ts ? 1 : -1));

    return {
        meta: { schema: 2, seededAt: T.toISOString().slice(0, 10), rev: 1 },
        settings: {
            shopName: 'CafeFlow Demo Cafe',
            branch: 'สาขาสำนักงานใหญ่',
            address: '99/1 ถ.ศรีสุนทร ต.เชิงทะเล อ.ถลาง จ.ภูเก็ต 83110',
            taxId: '0835566001234',
            vatPercent: 7,

            cashMode: 'A',
            kdsWarnMin: 3,

            receiptWidth: '80mm',
            kitchenSlipWidth: '58mm',

            /* ── คีออสก์ (§9, §35) — จอสัมผัส 21-32 นิ้ว Full HD ──
               อ่านผ่าน CFKiosk.cfg() ที่ merge DEFAULTS เสมอ
